<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>预览 — 博客卡片式列表（蓝灰）</title>

  <!-- 从 repo 载入样式（main 分支） -->
  <link rel="stylesheet" href="/assets/css/styles.css">
  <!-- 可选：加载 Inter 字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* 为在 GitHub Pages/raw 直接预览时保证样式加载，添加小范围回退样式 */
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <!-- 下面是示例文章列表（与 templates/article-list.html 相同） -->
  <div class="blog-shell">
    <header class="page-header">
      <h1>博客文章</h1>
      <div class="sub-title">最新文章</div>
    </header>

    <ul class="article-list">
      <li class="article-item">
        <a class="article-link" href="#">
          <article class="article-card">
            <img class="article-image"
                 src="https://images.unsplash.com/photo-1503264116251-35a269479413?w=1600&q=80&auto=format&fit=crop"
                 alt="文章封面 1">
            <div class="article-content">
              <div class="article-meta">
                <span class="article-tag">前端</span>
                <time datetime="2026-09-28">2026-09-28</time>
              </div>

              <h2 class="article-title">如何设计更现代的博客文章列表</h2>

              <p class="article-summary">
                在信息密度和视觉层级之间找到平衡，让文章列表既清晰又具备专业感。
              </p>

              <div class="article-footer">
                <span>5 分钟阅读</span>
                <span class="article-readmore">阅读全文 →</span>
              </div>
            </div>
          </article>
        </a>
      </li>

      <li class="article-item">
        <a class="article-link" href="#">
          <article class="article-card">
            <img class="article-image"
                 src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1600&q=80&auto=format&fit=crop"
                 alt="文章封面 2">
            <div class="article-content">
              <div class="article-meta">
                <span class="article-tag">设计</span>
                <time datetime="2026-09-20">2026-09-20</time>
              </div>

              <h2 class="article-title">蓝灰配色与卡片布局的视觉实践</h2>

              <p class="article-summary">
                使用统一的调色板和适度的留白，让内容自然呈现，提升阅读舒适度。
              </p>

              <div class="article-footer">
                <span>4 分钟阅读</span>
                <span class="article-readmore">阅读全文 →</span>
              </div>
            </div>
          </article>
        </a>
      </li>

      <li class="article-item">
        <a class="article-link" href="#">
          <article class="article-card">
            <img class="article-image"
                 src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1600&q=80&auto=format&fit=crop"
                 alt="文章封面 3">
            <div class="article-content">
              <div class="article-meta">
                <span class="article-tag">实践</span>
                <time datetime="2026-09-12">2026-09-12</time>
              </div>

              <h2 class="article-title">博客首页如何提升专业感和可读性</h2>

              <p class="article-summary">
                从字重、间距、分组到图文比例，系统化优化页面视觉层级。
              </p>

              <div class="article-footer">
                <span>6 分钟阅读</span>
                <span class="article-readmore">阅读全文 →</span>
              </div>
            </div>
          </article>
        </a>
      </li>
    </ul>
  </div>

  <script>
    // small script to ensure external stylesheet is loaded when previewed raw
    (function(){
      function ensureCSS(){
        var href = '/assets/css/styles.css';
        var link = document.querySelector('link[href="'+href+'"]');
        if(!link){
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = href;
          document.head.appendChild(l);
        }
      }
      if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', ensureCSS);
      else ensureCSS();
    })();
  </script>
</body>
</html>
